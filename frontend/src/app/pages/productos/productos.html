<header class="navbar">
  <div class="navbar-brand">
    <span class="logo-dot"></span>
    <h1>Pedidos<span>360</span></h1>
  </div>
  <nav class="navbar-links">
    <a routerLink="/home" routerLinkActive="active">Dashboard</a>
    <a routerLink="/pedidos" routerLinkActive="active">Pedidos</a>
    <a routerLink="/productos" routerLinkActive="active">Productos</a>
    <a routerLink="/clientes" routerLinkActive="active">Clientes</a>
    <a routerLink="/notificaciones" routerLinkActive="active">Notificaciones</a>
  </nav>
  <button class="btn-primary">+ Nuevo producto</button>
</header>
<main class="container">
  <section class="panel">
    <div class="panel-header">
      <h2>Productos</h2>
      <input type="text" class="search-input" placeholder="Buscar producto...">
    </div>
    <table class="orders-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody>
        @for (p of productos; track p.id) {
          <tr>
            <td>#{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.descripcion }}</td>
            <td>${{ p.precio }}</td>
            <td>
              <span class="badge" [class.badge-danger]="p.stock === 0" [class.badge-success]="p.stock > 0">
                {{ p.stock }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="empty-row">No hay productos registrados.</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</main>
