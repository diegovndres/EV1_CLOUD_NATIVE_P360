<header class="navbar">
  <div class="navbar-brand">
    <span class="logo-dot"></span>
    <h1>Pedidos<span>360</span></h1>
  </div>
  <nav class="navbar-links">
    <a href="#" class="active">Dashboard</a>
    <a href="#">Pedidos</a>
    <a href="#">Clientes</a>
    <a href="#">Reportes</a>
  </nav>
  <button class="btn-primary">+ Nuevo pedido</button>
</header>
<main class="container">
  <section class="panel">
    <div class="panel-header">
      <h2>Pedidos</h2>
      <input type="text" class="search-input" placeholder="Buscar pedido...">
    </div>
    <table class="orders-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Fecha</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (p of pedidos; track p.id) {
          <tr>
            <td>#{{ p.id }}</td>
            <td>{{ p.cliente }}</td>
            <td>{{ p.producto }}</td>
            <td>{{ p.cantidad }}</td>
            <td>{{ p.fecha }}</td>
            <td><span class="badge">{{ p.estado }}</span></td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</main>
