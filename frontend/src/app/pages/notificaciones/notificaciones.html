<header class="navbar">
  <div class="navbar-brand">
    <span class="logo-dot"></span>
    <h1>Pedidos<span>360</span></h1>
  </div>
  <nav class="navbar-links">
    <a routerLink="/home" routerLinkActive="active">Dashboard</a>
    <a routerLink="/pedidos" routerLinkActive="active">Pedidos</a>
    <a routerLink="/productos" routerLinkActive="active">Productos</a>
    <a routerLink="/clientes" routerLinkActive="active">Clientes</a>
    <a routerLink="/notificaciones" routerLinkActive="active">Notificaciones</a>
  </nav>
  <button class="btn-primary">+ Nueva notificación</button>
</header>
<main class="container">
  <section class="panel">
    <div class="panel-header">
      <h2>Notificaciones</h2>
      <input type="text" class="search-input" placeholder="Buscar notificación...">
    </div>
    <table class="orders-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Mensaje</th>
          <th>Destinatario</th>
          <th>Fecha</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (n of notificaciones; track n.id) {
          <tr>
            <td>#{{ n.id }}</td>
            <td>{{ n.mensaje }}</td>
            <td>{{ n.destinatario }}</td>
            <td>{{ n.fecha }}</td>
            <td><span class="badge">{{ n.estado }}</span></td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="empty-row">No hay notificaciones registradas.</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</main>
